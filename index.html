<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullstack User Management</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
    }
    h2 {
      color: #333;
      margin-top: 0;
      border-bottom: 2px solid #007bff;
      padding-bottom: 8px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #666;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin-top: 20px;
    }
    li {
      background: #eef2f5;
      margin-bottom: 8px;
      padding: 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      color: #333;
      font-weight: 500;
    }
    .status {
      font-size: 12px;
      margin-top: 10px;
      color: #28a745;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Add New User</h2>
    <form id="userForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter name" required />
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter email" required />
      </div>
      <button type="submit">Submit User</button>
    </form>
    <div id="statusMessage" class="status"></div>

    <h2>Registered Users List</h2>
    <ul id="userList"></ul>
  </div>

  <script>
    // Node.js API Gateway URL
    const API_URL = 'http://localhost:3000/gateway/users';

    // Fetch existing users from Gateway
    async function fetchUsers() {
      try {
        const response = await fetch(API_URL);
        const users = await response.json();
        
        const list = document.getElementById('userList');
        list.innerHTML = '';

        if(users.length === 0) {
          list.innerHTML = '<li>No users found.</li>';
          return;
        }

        users.forEach(user => {
          const li = document.createElement('li');
          li.innerHTML = `<span><strong>${user.name}</strong></span> <span>${user.email}</span>`;
          list.appendChild(li);
        });
      } catch (error) {
        console.error('Error fetching users:', error);
        document.getElementById('userList').innerHTML = '<li style="color:red;">Failed to connect to Node.js Gateway!</li>';
      }
    }

    // Handle Form Submission
    document.getElementById('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const statusMsg = document.getElementById('statusMessage');

      statusMsg.textContent = 'Submitting data...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email })
        });

        if (response.ok) {
          statusMsg.textContent = 'User added successfully!';
          document.getElementById('name').value = '';
          document.getElementById('email').value = '';
          fetchUsers(); // Refresh list after addition
        } else {
          statusMsg.textContent = 'Error adding user.';
        }
      } catch (error) {
        console.error('Error adding user:', error);
        statusMsg.textContent = 'Failed to reach server.';
      }
    });

    // Initial load fetch
    fetchUsers();
  </script>

</body>
</html>
